<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wdth,wght@85..100,400..600&display=swap">
<title>Wearfors · Концепты</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: logo, then the prototype list as full-width rows */
:root{
  --bg:#0B0E2E; --fg:#EEF1F6; --muted:#9AA3B8; --line:#262B55; --accent:#FDB813;
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans)}
.wrap{max-width:960px;margin:0 auto;padding-block:48px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{height:56px;width:auto;display:block;margin-bottom:40px}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li a{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:baseline;padding:32px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:background .2s}
li a:hover,li a:focus-visible{background:rgba(253,184,19,.06)}
li a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k{font:500 14px var(--mono);color:var(--accent);padding-left:8px}
.t{font-stretch:85%;font-weight:600;font-size:clamp(26px,4vw,40px);line-height:1.1}
.go{font:12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-right:8px}
li a:hover .go{color:var(--accent)}
@media (max-width:520px){li a{grid-template-columns:36px 1fr}.go{display:none}}
</style>
<div class="wrap">
  <img class="logo" src="img/logo_white.webp" alt="Wearfors">
  <ol>
    <li><a href="a-passport.html"><span class="k">A</span><span class="t">Технический паспорт</span><span class="go">Открыть →</span></a></li>
    <li><a href="b-telemetry.html"><span class="k">B</span><span class="t">Телеметрия</span><span class="go">Открыть →</span></a></li>
    <li><a href="d-blueprint.html"><span class="k">D</span><span class="t">Чертёж в движении</span><span class="go">Открыть →</span></a></li>
  </ol>
</div>
